<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/02.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Recursos Humanos - ASYTEC SISTEMAS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Raleway:wght@300;400;500;700&display=swap" rel="stylesheet">
    </head>
  <body>
    <div id="root"></div>

    <div id="asytec-boot" aria-hidden="true">
      <div class="asytec-boot__ring">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="asytec-boot-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1e88e5" />
              <stop offset="100%" stop-color="#7e57c2" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="6" />
          <circle cx="50" cy="50" r="42" fill="none" stroke="url(#asytec-boot-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="80 200" />
        </svg>
        <img src="/logo3.png" alt="Asytec Sistemas" />
      </div>
      <p class="asytec-boot__text">Cargando<span class="asytec-boot__dots"><span></span><span></span><span></span></span></p>
    </div>

    <style>
      #asytec-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        font-family: 'Poppins', system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      body.app-ready #asytec-boot {
        opacity: 0;
        visibility: hidden;
      }
      #asytec-boot .asytec-boot__ring {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #asytec-boot .asytec-boot__ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: asytec-spin 1.2s linear infinite;
      }
      #asytec-boot .asytec-boot__ring img {
        width: 70px;
        height: 70px;
        object-fit: contain;
        animation: asytec-pulse 1.6s ease-in-out infinite;
        z-index: 1;
      }
      #asytec-boot .asytec-boot__text {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      #asytec-boot .asytec-boot__dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #1e88e5;
        margin-left: 2px;
        animation: asytec-bounce 1.2s ease-in-out infinite;
      }
      #asytec-boot .asytec-boot__dots span:nth-child(2) { animation-delay: 0.15s; }
      #asytec-boot .asytec-boot__dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes asytec-spin { to { transform: rotate(360deg); } }
      @keyframes asytec-pulse { 0%,100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes asytec-bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.3; } 40% { transform: translateY(-3px); opacity: 1; } }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
